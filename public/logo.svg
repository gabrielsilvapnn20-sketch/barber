<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="João Victor Barbershop">
  <defs>
    <pattern id="jvStripes" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="46" height="46" fill="#ffffff"/>
      <rect width="15" height="46" fill="#d1202f"/>
      <rect x="23" width="15" height="46" fill="#1e3a8a"/>
    </pattern>
    <linearGradient id="jvCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="250" fill="#141414"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.65"/>

  <!-- Top name -->
  <text x="256" y="104" text-anchor="middle" fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="2">JOÃO VICTOR</text>

  <!-- Barber pole -->
  <g>
    <rect x="223" y="150" width="66" height="212" rx="16" fill="url(#jvStripes)"/>
    <rect x="223" y="150" width="66" height="212" rx="16" fill="none" stroke="#111111" stroke-width="3"/>
    <rect x="214" y="140" width="84" height="26" rx="10" fill="url(#jvCap)" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="214" y="348" width="84" height="26" rx="10" fill="url(#jvCap)" stroke="#6b7280" stroke-width="1.5"/>
  </g>

  <!-- Banner -->
  <g>
    <path d="M64 246 h384 v56 h-384 z" fill="#ffffff"/>
    <path d="M64 246 l-26 28 l26 28 z" fill="#cbd5e1"/>
    <path d="M448 246 l26 28 l-26 28 z" fill="#cbd5e1"/>
    <text x="256" y="286" text-anchor="middle" fill="#141414"
      font-family="'Arial Black', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2">BARBERSHOP</text>
  </g>

  <!-- Bottom tagline -->
  <text x="256" y="430" text-anchor="middle" fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" letter-spacing="6">BARBA E CABELO</text>
  <circle cx="150" cy="410" r="4" fill="#ffffff"/>
  <circle cx="362" cy="410" r="4" fill="#ffffff"/>
</svg>
