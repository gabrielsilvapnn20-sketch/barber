<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lanchonete Rodrigues">
  <defs>
    <radialGradient id="lrBg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f5a800"/>
    </radialGradient>
    <linearGradient id="lrOval" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Fundo amarelo (cor base da marca) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#lrBg)"/>

  <!-- Moldura oval azul -->
  <ellipse cx="256" cy="256" rx="212" ry="176" fill="none" stroke="url(#lrOval)" stroke-width="14"/>
  <ellipse cx="256" cy="256" rx="212" ry="176" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <!-- Espeto (identidade do negócio) -->
  <g transform="rotate(-20 256 150)">
    <rect x="120" y="142" width="272" height="12" rx="6" fill="#7a3b12"/>
    <circle cx="176" cy="148" r="26" fill="#8a4a1e" stroke="#5b2f10" stroke-width="4"/>
    <circle cx="236" cy="148" r="26" fill="#b5651d" stroke="#5b2f10" stroke-width="4"/>
    <circle cx="296" cy="148" r="26" fill="#8a4a1e" stroke="#5b2f10" stroke-width="4"/>
    <circle cx="356" cy="148" r="26" fill="#b5651d" stroke="#5b2f10" stroke-width="4"/>
  </g>

  <!-- "Lanchonete" em preto -->
  <text x="256" y="278" text-anchor="middle" fill="#111111"
    font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1">Lanchonete</text>

  <!-- "Rodrigues" em vermelho/bordô com contorno -->
  <text x="256" y="356" text-anchor="middle" fill="#d1202f" stroke="#111111" stroke-width="2"
    font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="1"
    paint-order="stroke fill">Rodrigues</text>

  <!-- Tagline -->
  <text x="256" y="410" text-anchor="middle" fill="#1e40af"
    font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="6">ESPETINHO &amp; JANTINHA</text>
</svg>
